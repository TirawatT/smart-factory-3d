version: "3.9"

# =============================================================================
# Smart Factory IoT Platform — Message Broker Infrastructure
# =============================================================================
# Services:
#   emqx        — MQTT broker (EMQX 5.5)
#   zookeeper   — Kafka coordinator
#   kafka       — Event streaming backbone
#   kafka-ui    — Kafka web dashboard
#   kafka-init  — One-shot topic creator
#   postgres    — TimescaleDB for time-series telemetry
#   redis       — Session cache / pub-sub bridge
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # EMQX — MQTT Broker
  # ---------------------------------------------------------------------------
  emqx:
    image: emqx/emqx:5.5.0
    container_name: sf-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"    # MQTT (TCP)
      - "8083:8083"    # MQTT over WebSocket
      - "8084:8084"    # MQTT over WebSocket (TLS)
      - "18083:18083"  # EMQX Dashboard HTTP
    environment:
      EMQX_NODE_NAME: "emqx@127.0.0.1"
      EMQX_DASHBOARD__DEFAULT_PASSWORD: "SmartFactory2026!"
      # Disable clustering for single-node dev setup
      EMQX_CLUSTER__DISCOVERY_STRATEGY: "manual"
    volumes:
      - ./emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - emqx-data:/opt/emqx/data
    networks:
      - sf-network
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Zookeeper — Kafka coordination service
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: sf-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    networks:
      - sf-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Kafka — Event streaming backbone
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: sf-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"    # Internal (container-to-container)
      - "29092:29092"  # External (host / localhost)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168          # 7 days default
      KAFKA_LOG_SEGMENT_BYTES: 1073741824     # 1 GB
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_NUM_PARTITIONS: 4
    networks:
      - sf-network
    healthcheck:
      test:
        [
          "CMD",
          "kafka-broker-api-versions",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Kafka Init — one-shot topic creation
  # ---------------------------------------------------------------------------
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: sf-kafka-init
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - sf-network
    command: >
      bash -c "
        echo 'Waiting for Kafka to be fully ready...' &&
        sleep 5 &&

        echo '=== Creating sf.telemetry (12 partitions, 7-day retention) ===' &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists
          --topic sf.telemetry
          --partitions 12
          --replication-factor 1
          --config retention.ms=604800000
          --config cleanup.policy=delete &&

        echo '=== Creating sf.alerts (4 partitions, 30-day retention) ===' &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists
          --topic sf.alerts
          --partitions 4
          --replication-factor 1
          --config retention.ms=2592000000
          --config cleanup.policy=delete &&

        echo '=== Creating sf.commands (4 partitions, 1-day retention) ===' &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists
          --topic sf.commands
          --partitions 4
          --replication-factor 1
          --config retention.ms=86400000
          --config cleanup.policy=delete &&

        echo '=== Creating sf.cmd-ack (4 partitions, 1-day retention) ===' &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists
          --topic sf.cmd-ack
          --partitions 4
          --replication-factor 1
          --config retention.ms=86400000
          --config cleanup.policy=delete &&

        echo '=== Creating sf.device-status (4 partitions, 7-day retention) ===' &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists
          --topic sf.device-status
          --partitions 4
          --replication-factor 1
          --config retention.ms=604800000
          --config cleanup.policy=delete &&

        echo '=== All topics created. Listing topics... ===' &&
        kafka-topics --bootstrap-server kafka:9092 --list &&
        echo 'kafka-init complete.'
      "

  # ---------------------------------------------------------------------------
  # Kafka UI — Web dashboard for Kafka
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sf-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "smartfactory"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
      KAFKA_CLUSTERS_0_ZOOKEEPER: "zookeeper:2181"
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - sf-network

  # ---------------------------------------------------------------------------
  # PostgreSQL / TimescaleDB — Time-series data store
  # ---------------------------------------------------------------------------
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: sf-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: smartfactory
      POSTGRES_USER: sfadmin
      POSTGRES_PASSWORD: "SmartFactory2026!"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - sf-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfadmin -d smartfactory"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis — Session cache, pub-sub bridge, rate-limit store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: sf-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
        --requirepass SmartFactory2026!
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save 60 1
        --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - sf-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "SmartFactory2026!", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# =============================================================================
# Networks
# =============================================================================
networks:
  sf-network:
    driver: bridge
    name: sf-network

# =============================================================================
# Named volumes
# =============================================================================
volumes:
  emqx-data:
    name: sf-emqx-data
  postgres-data:
    name: sf-postgres-data
  redis-data:
    name: sf-redis-data
