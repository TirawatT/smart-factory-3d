##--------------------------------------------------------------------
## Smart Factory — EMQX ACL (Access Control List)
##
## Format (file-based ACL):
##   {allow | deny, {user | clientid}, "<value>", {publish | subscribe | all}, ["<topic>", ...]}.
##
## Evaluated top-to-bottom; first matching rule wins.
## Unmatched requests fall through to the broker's no_match policy (deny).
##
## Client ID conventions:
##   sim-<deviceId>     — local sensor simulator (dev/test)
##   dev-<deviceId>     — physical IoT device
##   backend-<name>     — backend microservice / Kafka bridge
##   dashboard          — web dashboard frontend
##   admin              — privileged admin client
##--------------------------------------------------------------------


%%--------------------------------------------------------------------
%% ADMIN — full access
%%--------------------------------------------------------------------
{allow, {clientid, "admin"}, all, ["#"]}.


%%--------------------------------------------------------------------
%% DASHBOARD client — subscribe to everything; cannot publish
%%--------------------------------------------------------------------
{allow, {clientid, "dashboard"}, subscribe, ["sf/#"]}.
{allow, {clientid, "dashboard"}, publish,   ["sf/+/+/cmd"]}.


%%--------------------------------------------------------------------
%% SIMULATOR clients  (clientid prefix: sim-)
%% Allowed to publish on the full sf/# hierarchy so they can mimic
%% any device for testing. Subscribe to their own cmd topics.
%%--------------------------------------------------------------------

%% sim-* can publish anywhere under sf/#
{allow, {clientid, ~r/^sim-.+/}, publish,   ["sf/#"]}.

%% sim-* can subscribe to cmd topics for the devices they simulate
{allow, {clientid, ~r/^sim-.+/}, subscribe, ["sf/+/+/cmd", "sf/+/+/cmd/#"]}.


%%--------------------------------------------------------------------
%% DEVICE clients  (clientid prefix: dev-)
%%
%% Devices must only publish to their own topics and subscribe
%% to their own command topic. clientid == deviceId (e.g. dev-001).
%%--------------------------------------------------------------------

%% Publish telemetry:  sf/{siteId}/{building}/{floor}/{deviceId}/telemetry/{sensorType}
%% EMQX uses %c as the clientid placeholder in topic rules.
{allow, {clientid, ~r/^dev-.+/}, publish, [
  "sf/+/+/+/%c/telemetry/+",
  "sf/+/%c/status",
  "sf/+/%c/cmd/ack",
  "sf/+/alert"
]}.

%% Subscribe to their own command topic only
{allow, {clientid, ~r/^dev-.+/}, subscribe, [
  "sf/+/%c/cmd",
  "sf/+/%c/cmd/#"
]}.


%%--------------------------------------------------------------------
%% BACKEND clients  (clientid prefix: backend-)
%%
%% Backend services (Kafka bridge, API server) need broad subscribe
%% access and limited publish access (to send commands to devices).
%%--------------------------------------------------------------------

%% Backend can subscribe to all site topics
{allow, {clientid, ~r/^backend-.+/}, subscribe, ["sf/#"]}.

%% Backend can publish commands to any device
{allow, {clientid, ~r/^backend-.+/}, publish, [
  "sf/+/+/cmd",
  "sf/+/+/cmd/#"
]}.


%%--------------------------------------------------------------------
%% Default — deny everything else
%%--------------------------------------------------------------------
{deny, all, all, ["#"]}.
