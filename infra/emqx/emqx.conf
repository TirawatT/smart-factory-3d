##--------------------------------------------------------------------
## Smart Factory — EMQX 5.x Configuration
## Reference: https://www.emqx.io/docs/en/v5.5/configuration/configuration.html
##--------------------------------------------------------------------

##--------------------------------------------------------------------
## Node
##--------------------------------------------------------------------
node {
  name = "emqx@127.0.0.1"
  cookie = "smartfactory_secret_cookie"
  data_dir = "/opt/emqx/data"
}

##--------------------------------------------------------------------
## Dashboard
##--------------------------------------------------------------------
dashboard {
  listeners {
    http {
      bind = 18083
    }
  }
  default_username = "admin"
  default_password = "SmartFactory2026!"
}

##--------------------------------------------------------------------
## MQTT Listeners
##--------------------------------------------------------------------
listeners {
  ## TCP listener — primary MQTT port
  tcp.default {
    bind = "0.0.0.0:1883"
    max_connections = 100000
    ## Keep-alive tolerance: devices may miss up to 1.5× their keep-alive interval
    mountpoint = ""
    proxy_protocol = false
    tcp_options {
      send_timeout = 15s
      send_timeout_close = true
      recbuf = 4KB
      sndbuf = 4KB
      buffer = 4KB
      nodelay = true
      reuseaddr = true
    }
  }

  ## WebSocket listener — for browser / frontend clients
  ws.default {
    bind = "0.0.0.0:8083"
    max_connections = 10000
    websocket {
      mqtt_path = "/mqtt"
    }
  }

  ## WebSocket + TLS listener (certificates must be configured separately)
  ## Uncomment and add cert paths for production use.
  # wss.default {
  #   bind = "0.0.0.0:8084"
  #   ssl_options {
  #     certfile = "/opt/emqx/etc/certs/cert.pem"
  #     keyfile  = "/opt/emqx/etc/certs/key.pem"
  #   }
  # }
}

##--------------------------------------------------------------------
## Authentication
##--------------------------------------------------------------------
## DEV MODE: Allow anonymous connections so the simulator and frontend
## can connect without credentials. Switch to password-based auth
## (or mTLS) before deploying to production.
authentication = [
  {
    mechanism = password_based
    backend   = built_in_database
    user_id_type = clientid
    ## Allow anonymous fallthrough — remove this line in production
    enable = false
  }
]

## Anonymous access enabled for development
## Set to false and configure authentication above for production.
allow_anonymous = true

##--------------------------------------------------------------------
## Authorization (ACL)
##--------------------------------------------------------------------
authorization {
  ## Deny by default — only matched rules are permitted.
  no_match = deny
  deny_action = disconnect

  sources = [
    {
      type = file
      enable = true
      path = "/opt/emqx/etc/acl.conf"
    }
  ]
}

##--------------------------------------------------------------------
## MQTT Settings
##--------------------------------------------------------------------
mqtt {
  ## Maximum MQTT packet size (default 1 MB)
  max_packet_size = 1MB
  ## Maximum QoS level supported by the broker
  max_qos_allowed = 2
  ## Retain messages enabled
  retain_available = true
  ## Wildcard subscriptions enabled
  wildcard_subscription = true
  ## Shared subscriptions enabled (used by backend consumers)
  shared_subscription = true
  ## Maximum number of subscriptions per client (0 = unlimited)
  max_subscriptions = 0
  ## Keep-alive backoff multiplier
  keepalive_multiplier = 1.5
}

##--------------------------------------------------------------------
## Broker Internals
##--------------------------------------------------------------------
broker {
  ## Shared-subscription delivery strategy
  shared_subscription_strategy = round_robin
}

##--------------------------------------------------------------------
## Logging
##--------------------------------------------------------------------
log {
  console {
    enable = true
    level  = warning
    formatter = text
  }
  file {
    enable = true
    level  = warning
    path   = "/opt/emqx/data/log/emqx.log"
    rotation_count = 5
    rotation_size  = 10MB
  }
}

##--------------------------------------------------------------------
## Telemetry (disable call-home in production)
##--------------------------------------------------------------------
telemetry {
  enable = false
}
